<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>员工考勤查询系统 | 坚朗秦泰机电</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #eef2f7 0%, #d9e2ec 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1350px;
            margin: 0 auto;
        }

        /* 公司头部 */
        .company-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .company-name {
            font-size: 1.9rem;
            font-weight: 700;
            color: #1a3e50;
            background: rgba(255,255,245,0.85);
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 80px;
            backdrop-filter: blur(4px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            letter-spacing: 1px;
        }

        .period {
            font-size: 1rem;
            color: #2c5a6e;
            margin-top: 12px;
            font-weight: 500;
        }

        /* 卡片查询区 */
        .query-card {
            background: white;
            border-radius: 36px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.2);
            padding: 1.8rem 2rem;
            margin-bottom: 2.5rem;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,240,0.8);
        }

        .query-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #1f4e6a;
            border-left: 6px solid #f39c12;
            padding-left: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: flex-end;
        }

        .input-group {
            flex: 1 1 260px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 0.4rem;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 40px;
            transition: 0.2s;
            background: #fefefe;
            outline: none;
        }

        .input-group input:focus {
            border-color: #f39c12;
            box-shadow: 0 0 0 3px rgba(243,156,18,0.2);
        }

        .btn-query {
            background: #2c6e9e;
            border: none;
            padding: 0.85rem 2rem;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .btn-query:hover {
            background: #1f5480;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .reset-btn {
            background: #95a5a6;
            box-shadow: none;
        }
        .reset-btn:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
        }

        .error-msg {
            background: #fee2e2;
            color: #b91c1c;
            padding: 0.9rem 1.5rem;
            border-radius: 50px;
            margin-top: 1.2rem;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 8px;
            border-left: 6px solid #e53e3e;
        }

        /* 结果卡片 */
        .result-card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15);
            overflow: hidden;
            display: none;
            animation: fadeUp 0.35s ease;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            background: #1f4e6a;
            padding: 1.2rem 2rem;
            color: white;
        }

        .result-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .emp-badge {
            background: #f39c12;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 0 0 0.5rem 0;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            min-width: 1000px;
        }

        .attendance-table th, .attendance-table td {
            border-bottom: 1px solid #e9ecef;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
        }

        .attendance-table th {
            background-color: #f8fafc;
            font-weight: 800;
            color: #1e4663;
            border-bottom: 2px solid #cbd5e1;
            font-size: 0.78rem;
            letter-spacing: 0.3px;
        }

        .attendance-table td {
            color: #1e293b;
            font-weight: 500;
        }

        .remark-cell {
            max-width: 240px;
            word-break: break-word;
            white-space: normal;
            text-align: left !important;
            font-size: 0.78rem;
            color: #4b5563;
        }

        .footer-note {
            background: #f9fafb;
            padding: 1rem 2rem;
            font-size: 0.72rem;
            color: #4b6b7e;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }

        @media (max-width: 700px) {
            .query-card {
                padding: 1.2rem;
            }
            .result-header h2 {
                font-size: 1.2rem;
            }
            .btn-query {
                padding: 0.7rem 1.2rem;
            }
        }
    </style>
</head>

<div class="container">

    <div class="query-card">

        <div class="form-row">

            </div>

                </thead>
                <tbody id="attendanceBody"></tbody>

        </div>
        <div class="footer-note">* 依据公司2026年4月考勤汇总表原始记录生成，如有疑问请联系人事行政部。</div>
    </div>
</div>

    // DOM
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const empNameInput = document.getElementById('empName');
    const idLast4Input = document.getElementById('idLast4');
    const errorMsgDiv = document.getElementById('errorMsg');
    const resultContainer = document.getElementById('resultContainer');
    const empNameDisp = document.getElementById('empNameDisp');
    const attendanceBody = document.getElementById('attendanceBody');

    function renderEmployee(emp) {
        empNameDisp.innerText = `${emp.name} (${emp.idLast4})`;
        const row = `
            <tr>
                <td>${emp.dept || '—'}</td>
                <td>${emp.group || '—'}</td>
                <td>${emp.position || '—'}</td>
                <td>${emp.weekdayPaid ?? 0}</td>
                <td>${emp.satRoutine ?? 0}</td>
                <td>${emp.weekendTotal ?? 0}</td>
                <td>${emp.sickWeekday ?? 0}</td>
                <td>${emp.personalWeekday ?? 0}</td>
                <td>${emp.personalSat ?? 0}</td>
                <td>${emp.absenteeism ?? 0}</td>
                <td>${emp.overtimeWeekday ?? 0}</td>
                <td>${emp.overtimeWeekend ?? 0}</td>
                <td>${emp.overtimeLegal ?? 0}</td>
                <td>${emp.latePenalty ?? 0}</td>
                <td>${emp.missPunch ?? 0}</td>
                <td class="remark-cell">${emp.remark || '—'}</td>
            </tr>
        `;
        attendanceBody.innerHTML = row;
        resultContainer.style.display = 'block';
        errorMsgDiv.style.display = 'none';
        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function performQuery() {
        const nameRaw = empNameInput.value.trim();
        const idRaw = idLast4Input.value.trim();
        if (!nameRaw || !idRaw) {
            errorMsgDiv.innerText = '⚠️ 请完整填写姓名及身份证后四位';
            errorMsgDiv.style.display = 'flex';
            resultContainer.style.display = 'none';
            return;
        }
        const matched = employeesDataset.find(emp => 
            emp.name === nameRaw && emp.idLast4.toUpperCase() === idRaw.toUpperCase()
        );
        if (matched) {
            renderEmployee(matched);
        } else {
            errorMsgDiv.innerText = `⚠️ 未找到匹配记录，请核对姓名及身份证后四位`;
            errorMsgDiv.style.display = 'flex';
            resultContainer.style.display = 'none';
        }
    }

    function resetForm() {
        empNameInput.value = '';
        idLast4Input.value = '';
        errorMsgDiv.style.display = 'none';
        resultContainer.style.display = 'none';
        attendanceBody.innerHTML = '';
        empNameDisp.innerText = '——';
        empNameInput.focus();
    }

    searchBtn.addEventListener('click', performQuery);
