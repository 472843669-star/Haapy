    // ----- 渲染表格 + 搜索逻辑 -----
    const tbody = document.getElementById('tableBody');
    const emptyMessage = document.getElementById('emptyMessage');
    const resultCount = document.getElementById('resultCount');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');

    // 格式化数字保留两位小数，若为0则显示0
    function fmt(val) {
      if (val === undefined || val === null) return '0';
      const num = parseFloat(val);
      if (isNaN(num)) return '0';
      return num.toFixed(2);
    }

    function renderTable(filterText) {
      const keyword = filterText.trim().toLowerCase();
      let filtered = rawData;
      if (keyword !== '') {
        filtered = rawData.filter(item => item.name.toLowerCase().includes(keyword));
      }

      // 清空并重新填充
      tbody.innerHTML = '';
      if (filtered.length === 0) {
        emptyMessage.style.display = 'block';
        resultCount.textContent = '共 0 人';
        return;
      }
      emptyMessage.style.display = 'none';
      resultCount.textContent = `共 ${filtered.length} 人`;

      filtered.forEach((emp, index) => {
        const tr = document.createElement('tr');
        // 高亮显示搜索匹配的行 (可选)
        if (keyword && emp.name.toLowerCase().includes(keyword)) {
          tr.classList.add('highlight-row');
        }
        tr.innerHTML = `
          <td>${emp.code}</td>
          <td class="name-highlight">${emp.name}</td>
          <td>${emp.pos}</td>
          <td>${emp.hire}</td>
          <td>${fmt(emp.base)}</td>
          <td>${fmt(emp.allow1)}</td>
          <td>${fmt(emp.allow2)}</td>
          <td>${fmt(emp.allow3)}</td>
          <td>${fmt(emp.allow4)}</td>
          <td>${fmt(emp.allow5)}</td>
          <td>${fmt(emp.allow6)}</td>
          <td>${fmt(emp.attend)}</td>
          <td>${fmt(emp.other)}</td>
          <td>${fmt(emp.ot)}</td>
          <td>${fmt(emp.perf)}</td>
          <td>${fmt(emp.seniority)}</td>
          <td>${fmt(emp.hrRate)}</td>
          <td>${fmt(emp.total)}</td>
          <td>${fmt(emp.taxBefore)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 初始化全部渲染
    renderTable('');

    // 搜索事件
    function doSearch() {
      renderTable(searchInput.value);
    }
    searchBtn.addEventListener('click', doSearch);
    searchInput.addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        doSearch();
      }
    });

    // 清除搜索
    clearBtn.addEventListener('click', function() {
      searchInput.value = '';
      renderTable('');
    });
